<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3e8f"/>
      <stop offset="1" stop-color="#16204f"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="0.45" stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#d9481c"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#b9c1d6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>

  <!-- ink stroke under the cap -->
  <path d="M250 800 C 360 730, 440 860, 560 790 S 740 740, 790 770"
        fill="none" stroke="#7fa6ff" stroke-width="34" stroke-linecap="round" opacity="0.9"/>

  <!-- pen cap, tilted -->
  <g transform="rotate(30 512 470)" filter="url(#shadow)">
    <!-- cap body: rounded top, slight taper towards the opening -->
    <path d="M432 250
             Q432 170 512 170
             Q592 170 592 250
             L604 680
             Q604 700 584 700
             L440 700
             Q420 700 420 680 Z"
          fill="url(#cap)"/>
    <!-- opening rim -->
    <rect x="416" y="664" width="192" height="40" rx="14" fill="#b83a14"/>
    <!-- highlight -->
    <path d="M462 240 Q462 205 492 196 L500 640 L470 640 Z" fill="#ffffff" opacity="0.22"/>
    <!-- clip -->
    <path d="M560 230
             L616 230
             Q636 230 636 252
             L636 560
             Q636 600 606 606
             Q590 608 590 590
             L590 268
             L560 268 Z"
          fill="url(#clip)"/>
  </g>
</svg>
